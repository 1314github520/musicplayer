<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>🎵 音乐播放器</title>

    <style>
      body {
        margin: 0;
        font-family: "微软雅黑";
        color: #fff;
        text-align: center;
        overflow: hidden;
      }

      /* 背景 */
      .bg {
        position: fixed;
        width: 100%;
        height: 100%;
        background-size: cover;
        filter: blur(25px) brightness(0.5);
        z-index: -1;
      }

      /* 主体 */
      .player {
        width: 320px;
        margin: 50px auto;
      }

      /* 封面 */
      .cover {
        width: 260px;
        height: 260px;
        border-radius: 50%;
      }

      /* 播放时旋转 */
      .playing-cover {
        animation: spin 20s linear infinite;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      /* 标题 */
      .title {
        margin: 15px;
        font-size: 20px;
      }

      /* 提示 */
      .hint {
        font-size: 12px;
        opacity: 0.7;
      }

      /* 控制按钮 */
      .controls button {
        margin: 10px;
        padding: 12px;
        border: none;
        border-radius: 50%;
        background: #ff4d4d;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      /* 进度条 */
      .progress {
        width: 100%;
        margin-top: 10px;
      }

      /* 时间 */
      .time {
        font-size: 14px;
        margin-top: 5px;
      }

      /* 列表 */
      .list {
        margin-top: 20px;
        text-align: left;
      }

      .list div {
        padding: 8px;
        border-bottom: 1px solid #444;
        cursor: pointer;
      }

      .list div:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .playing {
        color: #ff4d4d;
      }
    </style>
  </head>

  <body>
    <div class="bg" id="bg"></div>

    <div class="player">
      <img id="cover" class="cover" src="img/default.jpg" />

      <div class="title" id="title">🎵 欢迎使用音乐播放器</div>
      <div class="hint" id="hint">点击歌曲或播放按钮开始</div>

      <audio id="audio"></audio>

      <input type="range" id="progress" class="progress" value="0" />

      <div class="time">
        <span id="current">00:00</span> / <span id="duration">00:00</span>
      </div>

      <div class="controls">
        <button onclick="prev()">⏮</button>
        <button onclick="toggle()">⏯</button>
        <button onclick="next()">⏭</button>
      </div>

      <div class="list" id="list"></div>
    </div>

    <script>
      // 歌曲列表（必须和你的文件名一致）
      const songs = [
        { name: "daoxiang", title: "稻香" },
        { name: "haiyuni", title: "海屿你" },
        { name: "let_it_go", title: "Let It Go" },
        { name: "lianren", title: "恋人" },
        { name: "maienli", title: "麦恩莉" },
        { name: "qilixiang", title: "七里香" },
        { name: "yequ", title: "夜曲" },
      ];

      let index = 0;
      const audio = document.getElementById("audio");

      // 初始化列表
      const list = document.getElementById("list");
      songs.forEach((s, i) => {
        const div = document.createElement("div");
        div.innerText = s.title;
        div.onclick = () => load(i, true); // 点击自动播放
        list.appendChild(div);
      });

      // 加载歌曲（支持是否自动播放）
      function load(i, autoPlay = false) {
        index = i;
        const song = songs[i];

        audio.src = "song/" + song.name + ".m4a";
        document.getElementById("cover").src = "img/" + song.name + ".jpg";
        document.getElementById("bg").style.backgroundImage =
          `url(img/${song.name}.jpg)`;
        document.getElementById("title").innerText = song.title;

        highlight();

        if (autoPlay) {
          audio.play();
          document.getElementById("cover").classList.add("playing-cover");
          document.getElementById("hint").style.display = "none";
        } else {
          audio.pause();
          document.getElementById("cover").classList.remove("playing-cover");
        }
      }

      // 播放 / 暂停
      function toggle() {
        if (audio.paused) {
          audio.play();
          document.getElementById("cover").classList.add("playing-cover");
          document.getElementById("hint").style.display = "none";
        } else {
          audio.pause();
          document.getElementById("cover").classList.remove("playing-cover");
        }
      }

      // 下一首
      function next() {
        index = (index + 1) % songs.length;
        load(index, true);
      }

      // 上一首
      function prev() {
        index = (index - 1 + songs.length) % songs.length;
        load(index, true);
      }

      // 自动下一首
      audio.onended = next;

      // 高亮当前歌曲
      function highlight() {
        document.querySelectorAll(".list div").forEach((el, i) => {
          el.classList.toggle("playing", i === index);
        });
      }

      // 时间格式
      function format(t) {
        if (!t) return "00:00";
        const m = Math.floor(t / 60);
        const s = Math.floor(t % 60);
        return `${m}:${s < 10 ? "0" + s : s}`;
      }

      // 更新进度
      audio.ontimeupdate = () => {
        document.getElementById("progress").value =
          (audio.currentTime / audio.duration) * 100 || 0;

        document.getElementById("current").innerText = format(
          audio.currentTime,
        );

        document.getElementById("duration").innerText = format(audio.duration);
      };

      // 拖动进度条
      document.getElementById("progress").oninput = (e) => {
        audio.currentTime = (audio.duration * e.target.value) / 100;
      };

      // 页面初始化（默认加载第一首但不播放）
      window.onload = () => {
        load(0, false);
      };
    </script>
  </body>
</html>
