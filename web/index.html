<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Music Player</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
  --primary: #1DB954;
  --primary-hover: #1ed760;
  --primary-glow: rgba(29, 185, 84, 0.3);
  --bg-dark: #0a0a0a;
  --bg-card: rgba(255, 255, 255, 0.05);
  --bg-card-hover: rgba(255, 255, 255, 0.08);
  --bg-elevated: rgba(40, 40, 40, 0.6);
  --text-primary: #ffffff;
  --text-secondary: rgba(255, 255, 255, 0.7);
  --text-muted: rgba(255, 255, 255, 0.5);
  --text-disabled: rgba(255, 255, 255, 0.3);
  --border-subtle: rgba(255, 255, 255, 0.08);
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.5);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-full: 9999px;
  --transition-fast: 0.15s ease;
  --transition-normal: 0.25s ease;
  --transition-slow: 0.4s ease;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif;
  background: var(--bg-dark);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.5;
}

.bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  background-color: var(--bg-dark);
  filter: blur(60px) brightness(0.3) saturate(1.2);
  transform: scale(1.2);
  z-index: -1;
  transition: background-image var(--transition-slow);
  opacity: 0;
}

.bg.loaded {
  opacity: 1;
}

.bg-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(180deg, 
    rgba(0, 0, 0, 0.2) 0%, 
    rgba(0, 0, 0, 0.6) 50%,
    rgba(0, 0, 0, 0.8) 100%
  );
  z-index: -1;
}

.app {
  width: 100%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px;
}

@media (min-width: 768px) {
  .app {
    padding: 40px 24px;
  }
}

.player {
  width: 100%;
  max-width: 440px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.search-box {
  position: relative;
  width: 100%;
}

.search-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 16px;
  pointer-events: none;
  transition: color var(--transition-fast);
}

.search-input {
  width: 100%;
  height: 48px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-full);
  padding: 0 48px;
  color: var(--text-primary);
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: all var(--transition-normal);
  backdrop-filter: blur(10px);
}

.search-input::placeholder {
  color: var(--text-muted);
}

.search-input:hover {
  background: var(--bg-card-hover);
  border-color: rgba(255, 255, 255, 0.12);
}

.search-input:focus {
  background: var(--bg-card-hover);
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-glow);
}

.search-input:focus + .search-icon {
  color: var(--primary);
}

.clear-btn {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 28px;
  height: 28px;
  background: rgba(255, 255, 255, 0.1);
  border: none;
  border-radius: 50%;
  color: var(--text-muted);
  font-size: 14px;
  cursor: pointer;
  opacity: 0;
  transition: all var(--transition-fast);
  display: flex;
  align-items: center;
  justify-content: center;
}

.clear-btn.visible {
  opacity: 1;
}

.clear-btn:hover {
  background: rgba(255, 255, 255, 0.2);
  color: var(--text-primary);
}

.player-core {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding: 24px;
  background: var(--bg-elevated);
  border-radius: var(--radius-lg);
  backdrop-filter: blur(20px);
  box-shadow: var(--shadow-lg);
}

.cover-container {
  position: relative;
  width: 240px;
  height: 240px;
}

@media (max-width: 480px) {
  .cover-container {
    width: 200px;
    height: 200px;
  }
}

.cover {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  box-shadow: var(--shadow-lg);
  transition: transform var(--transition-normal);
}

.cover.playing {
  animation: rotate 20s linear infinite;
}

.cover.paused {
  animation-play-state: paused;
}

@keyframes rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.cover-glow {
  position: absolute;
  top: -10%;
  left: -10%;
  width: 120%;
  height: 120%;
  border-radius: 50%;
  background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
  opacity: 0;
  transition: opacity var(--transition-normal);
  pointer-events: none;
}

.cover-glow.active {
  opacity: 1;
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 0.5; }
  50% { transform: scale(1.05); opacity: 0.8; }
}

.song-info {
  text-align: center;
  width: 100%;
}

.song-title {
  font-size: 20px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

@media (min-width: 768px) {
  .song-title {
    font-size: 22px;
  }
}

.song-artist {
  font-size: 14px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.lyrics-container {
  width: 100%;
  min-height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px 16px;
  background: rgba(0, 0, 0, 0.2);
  border-radius: var(--radius-md);
}

.lyric-line {
  font-size: 14px;
  color: var(--text-muted);
  text-align: center;
  transition: all var(--transition-normal);
}

.lyric-line.current {
  color: var(--primary);
  font-weight: 500;
}

.progress-section {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.progress-bar {
  width: 100%;
  height: 6px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: var(--radius-full);
  cursor: pointer;
  position: relative;
  overflow: visible;
}

.progress-fill {
  height: 100%;
  background: var(--primary);
  border-radius: var(--radius-full);
  width: 0%;
  position: relative;
  transition: width 0.1s linear;
}

.progress-bar:hover .progress-fill {
  background: var(--primary-hover);
}

.progress-thumb {
  position: absolute;
  right: -6px;
  top: 50%;
  transform: translateY(-50%);
  width: 12px;
  height: 12px;
  background: var(--text-primary);
  border-radius: 50%;
  box-shadow: var(--shadow-sm);
  opacity: 0;
  transition: opacity var(--transition-fast);
  pointer-events: none;
}

.progress-bar:hover .progress-thumb {
  opacity: 1;
}

.time-info {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.controls-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
}

.ctrl-btn {
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 50%;
  background: transparent;
  color: var(--text-secondary);
  font-size: 18px;
  cursor: pointer;
  transition: all var(--transition-fast);
  display: flex;
  align-items: center;
  justify-content: center;
}

.ctrl-btn:hover {
  background: var(--bg-card);
  color: var(--text-primary);
  transform: scale(1.05);
}

.ctrl-btn:active {
  transform: scale(0.95);
}

.ctrl-btn.primary {
  width: 64px;
  height: 64px;
  background: var(--primary);
  color: var(--text-primary);
  font-size: 24px;
  box-shadow: 0 8px 24px rgba(29, 185, 84, 0.4);
}

.ctrl-btn.primary:hover {
  background: var(--primary-hover);
  transform: scale(1.08);
  box-shadow: 0 12px 32px rgba(29, 185, 84, 0.5);
}

.ctrl-btn.primary:active {
  transform: scale(0.95);
}

.mode-btn {
  width: 36px;
  height: 36px;
  border: none;
  border-radius: 50%;
  background: transparent;
  color: var(--text-muted);
  font-size: 14px;
  cursor: pointer;
  transition: all var(--transition-fast);
  display: flex;
  align-items: center;
  justify-content: center;
}

.mode-btn:hover {
  color: var(--text-secondary);
}

.mode-btn.active {
  color: var(--primary);
}

.volume-row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 0 8px;
}

.volume-btn {
  width: 32px;
  height: 32px;
  border: none;
  border-radius: 50%;
  background: transparent;
  color: var(--text-muted);
  font-size: 16px;
  cursor: pointer;
  transition: all var(--transition-fast);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.volume-btn:hover {
  color: var(--text-secondary);
}

.volume-slider-container {
  flex: 1;
  height: 4px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: var(--radius-full);
  position: relative;
  cursor: pointer;
}

.volume-fill {
  height: 100%;
  background: var(--text-muted);
  border-radius: var(--radius-full);
  transition: width var(--transition-fast);
}

.volume-slider-container:hover .volume-fill {
  background: var(--text-secondary);
}

.playlist-section {
  width: 100%;
}

.playlist-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--bg-elevated);
  border-radius: var(--radius-md) var(--radius-md) 0 0;
  backdrop-filter: blur(20px);
}

.playlist-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
}

.playlist-count {
  font-size: 12px;
  color: var(--text-muted);
  background: rgba(255, 255, 255, 0.1);
  padding: 4px 10px;
  border-radius: var(--radius-full);
}

.list {
  background: var(--bg-card);
  border-radius: 0 0 var(--radius-md) var(--radius-md);
  max-height: 320px;
  overflow-y: auto;
  backdrop-filter: blur(10px);
}

@media (min-width: 768px) {
  .list {
    max-height: 400px;
  }
}

.list::-webkit-scrollbar {
  width: 6px;
}

.list::-webkit-scrollbar-track {
  background: transparent;
}

.list::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.15);
  border-radius: var(--radius-full);
}

.list::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.25);
}

.list-item {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  cursor: pointer;
  transition: all var(--transition-fast);
  border-bottom: 1px solid var(--border-subtle);
}

.list-item:last-child {
  border-bottom: none;
}

.list-item:hover {
  background: var(--bg-card-hover);
}

.list-item.playing {
  background: rgba(29, 185, 84, 0.1);
}

.list-item.playing .item-title {
  color: var(--primary);
}

.item-cover {
  width: 48px;
  height: 48px;
  border-radius: var(--radius-sm);
  object-fit: cover;
  margin-right: 14px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.05);
}

@media (max-width: 480px) {
  .item-cover {
    width: 44px;
    height: 44px;
    margin-right: 12px;
  }
}

.item-info {
  flex: 1;
  overflow: hidden;
  min-width: 0;
}

.item-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 2px;
}

.item-singer {
  font-size: 12px;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.item-duration {
  font-size: 12px;
  color: var(--text-disabled);
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
  margin-left: 12px;
}

.loading-state,
.error-state,
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
  gap: 12px;
}

.loading-spinner {
  width: 32px;
  height: 32px;
  border: 3px solid rgba(255, 255, 255, 0.1);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.loading-text {
  font-size: 14px;
  color: var(--text-muted);
}

.error-icon {
  font-size: 32px;
  margin-bottom: 8px;
}

.error-text {
  font-size: 14px;
  color: #ff6b6b;
  text-align: center;
}

.empty-icon {
  font-size: 40px;
  margin-bottom: 8px;
  opacity: 0.5;
}

.empty-text {
  font-size: 14px;
  color: var(--text-muted);
}

.footer-tip {
  text-align: center;
  font-size: 12px;
  color: var(--text-disabled);
  padding: 16px;
}

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--bg-elevated);
  color: var(--text-primary);
  padding: 12px 24px;
  border-radius: var(--radius-full);
  font-size: 14px;
  box-shadow: var(--shadow-lg);
  backdrop-filter: blur(20px);
  opacity: 0;
  transition: all 0.3s ease;
  z-index: 1000;
  pointer-events: none;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>

<div class="bg" id="bg"></div>
<div class="bg-overlay"></div>

<div class="app">
  <div class="player">
    
    <div class="search-box">
      <input 
        type="text" 
        class="search-input" 
        id="searchInput"
        placeholder="搜索歌曲、歌手..."
        autocomplete="off"
      />
      <span class="search-icon">🔍</span>
      <button class="clear-btn" id="clearBtn">✕</button>
    </div>

    <div class="player-core">
      <div class="cover-container">
        <img id="cover" class="cover" alt="Album Cover" />
        <div class="cover-glow" id="coverGlow"></div>
      </div>

      <div class="song-info">
        <div class="song-title" id="title">Music Player</div>
        <div class="song-artist" id="artist">选择一首歌曲开始播放</div>
      </div>

      <div class="lyrics-container">
        <div class="lyric-line" id="currentLyric">暂无歌词</div>
      </div>

      <div class="progress-section">
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill">
            <div class="progress-thumb"></div>
          </div>
        </div>
        <div class="time-info">
          <span id="currentTime">0:00</span>
          <span id="totalTime">0:00</span>
        </div>
      </div>

      <div class="controls-row">
        <button class="mode-btn" id="shuffleBtn" title="随机播放">🔀</button>
        <button class="ctrl-btn" id="prevBtn" title="上一首">⏮</button>
        <button class="ctrl-btn primary" id="playBtn" title="播放">▶</button>
        <button class="ctrl-btn" id="nextBtn" title="下一首">⏭</button>
        <button class="mode-btn active" id="repeatBtn" title="循环播放">🔁</button>
      </div>

      <div class="volume-row">
        <button class="volume-btn" id="volumeBtn" title="音量">🔊</button>
        <div class="volume-slider-container" id="volumeSliderContainer">
          <div class="volume-fill" id="volumeFill" style="width: 70%"></div>
        </div>
      </div>
    </div>

    <div class="playlist-section">
      <div class="playlist-header">
        <span class="playlist-title">播放列表</span>
        <span class="playlist-count" id="playlistCount">0 首</span>
      </div>
      <div class="list" id="list">
        <div class="loading-state">
          <div class="loading-spinner"></div>
          <span class="loading-text">加载中...</span>
        </div>
      </div>
    </div>

    <div class="footer-tip">
      空格 播放/暂停 · ← → 切换歌曲 · ↑ ↓ 音量 · M 静音
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<audio id="audio" preload="metadata"></audio>

<script>
const API_BASE = 'https://mexqf.top/api';
const RESOURCE_BASE = 'https://mexqf.top/resource';
const DEFAULT_COVER = 'https://mexqf.top/resource/img/default.jpg';

let songs = [];
let currentIndex = 0;
let isPlaying = false;
let playMode = 'order';
let shuffleIndices = [];
let isLoading = false;

const audio = document.getElementById('audio');
const bg = document.getElementById('bg');
const cover = document.getElementById('cover');
const coverGlow = document.getElementById('coverGlow');
const titleEl = document.getElementById('title');
const artistEl = document.getElementById('artist');
const currentLyric = document.getElementById('currentLyric');
const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const repeatBtn = document.getElementById('repeatBtn');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const currentTimeEl = document.getElementById('currentTime');
const totalTimeEl = document.getElementById('totalTime');
const listEl = document.getElementById('list');
const playlistCount = document.getElementById('playlistCount');
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const volumeBtn = document.getElementById('volumeBtn');
const volumeSliderContainer = document.getElementById('volumeSliderContainer');
const volumeFill = document.getElementById('volumeFill');
const toast = document.getElementById('toast');

let currentVolume = 0.7;
audio.volume = currentVolume;

function showToast(message, duration = 2000) {
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => {
    toast.classList.remove('show');
  }, duration);
}

function getResourceUrl(path) {
  if (!path || path === 'null' || path === 'undefined') {
    return DEFAULT_COVER;
  }
  if (path.startsWith('http://') || path.startsWith('https://')) {
    return path;
  }
  let cleanPath = path;
  if (cleanPath.startsWith('/resource/')) {
    cleanPath = cleanPath.substring('/resource'.length);
  } else if (cleanPath.startsWith('/musicplayer/')) {
    cleanPath = cleanPath.substring('/musicplayer'.length);
  } else if (!cleanPath.startsWith('/')) {
    cleanPath = '/' + cleanPath;
  }
  return RESOURCE_BASE + cleanPath;
}

function formatTime(sec) {
  if (!sec || isNaN(sec) || !isFinite(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function shuffleArray(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function preloadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(url);
    img.onerror = () => reject(new Error('Failed to load image'));
    img.src = url;
  });
}

async function fetchSongs() {
  try {
    isLoading = true;
    const res = await fetch(API_BASE + '/songs/all', {
      method: 'GET',
      headers: { 'Accept': 'application/json' }
    });
    
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }
    
    const json = await res.json();
    
    if (json.code !== 0) {
      throw new Error(json.message || '获取歌曲失败');
    }
    
    songs = json.data || [];
    
    if (!songs.length) {
      renderEmpty();
      return;
    }
    
    playlistCount.textContent = `${songs.length} 首`;
    renderList();
    loadSong(0);
    
  } catch (e) {
    console.error('Failed to fetch songs:', e);
    renderError(e.message);
  } finally {
    isLoading = false;
  }
}

function renderLoading() {
  listEl.innerHTML = `
    <div class="loading-state">
      <div class="loading-spinner"></div>
      <span class="loading-text">加载中...</span>
    </div>
  `;
}

function renderError(message) {
  listEl.innerHTML = `
    <div class="error-state">
      <span class="error-icon">⚠️</span>
      <span class="error-text">加载失败: ${message}</span>
    </div>
  `;
}

function renderEmpty() {
  listEl.innerHTML = `
    <div class="empty-state">
      <span class="empty-icon">🎵</span>
      <span class="empty-text">暂无歌曲</span>
    </div>
  `;
  playlistCount.textContent = '0 首';
}

function renderList(filterKeyword = '') {
  let filteredSongs = songs;
  
  if (filterKeyword) {
    const kw = filterKeyword.toLowerCase();
    filteredSongs = songs.filter(s => 
      (s.title && s.title.toLowerCase().includes(kw)) ||
      (s.singer && s.singer.toLowerCase().includes(kw)) ||
      (s.artist && s.artist.toLowerCase().includes(kw)) ||
      (s.album && s.album.toLowerCase().includes(kw))
    );
  }
  
  if (!filteredSongs.length) {
    listEl.innerHTML = `
      <div class="empty-state">
        <span class="empty-icon">🔍</span>
        <span class="empty-text">没有找到匹配的歌曲</span>
      </div>
    `;
    return;
  }
  
  listEl.innerHTML = '';
  
  filteredSongs.forEach((song) => {
    const actualIndex = songs.findIndex(s => s.id === song.id);
    const photoUrl = getResourceUrl(song.photo);
    const isCurrentPlaying = actualIndex === currentIndex;
    
    const div = document.createElement('div');
    div.className = 'list-item';
    if (isCurrentPlaying) div.classList.add('playing');
    
    div.innerHTML = `
      <img
        class="item-cover"
        src="${photoUrl}"
        alt="${song.title || 'Unknown'}"
        loading="lazy"
        onerror="this.src='${DEFAULT_COVER}'"
      />
      <div class="item-info">
        <div class="item-title">${escapeHtml(song.title || 'Unknown')}</div>
        <div class="item-singer">${escapeHtml(song.singer || song.artist || 'Unknown')}</div>
      </div>
      <div class="item-duration">${song.duration_text || ''}</div>
    `;
    
    div.addEventListener('click', () => {
      currentIndex = actualIndex;
      loadSong(currentIndex, true);
    });
    
    listEl.appendChild(div);
  });
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function loadSong(index, autoPlay = false) {
  if (index < 0 || index >= songs.length) return;
  
  currentIndex = index;
  const song = songs[index];
  
  const audioUrl = API_BASE + '/song/play?id=' + song.id;
  audio.src = audioUrl;
  
  const photoUrl = getResourceUrl(song.photo);
  
  cover.src = photoUrl;
  cover.onerror = () => { cover.src = DEFAULT_COVER; };
  
  bg.style.backgroundImage = `url(${photoUrl})`;
  bg.classList.add('loaded');
  
  titleEl.textContent = song.title || 'Unknown';
  artistEl.textContent = song.singer || song.artist || 'Unknown';
  
  currentLyric.textContent = '暂无歌词';
  currentLyric.className = 'lyric-line';
  
  highlightCurrent();
  
  if (autoPlay) {
    audio.play().catch(err => {
      console.error('Failed to play:', err);
      showToast('播放失败，请重试');
    });
  }
}

function highlightCurrent() {
  const items = document.querySelectorAll('.list-item');
  items.forEach((el) => {
    const titleEl = el.querySelector('.item-title');
    if (titleEl && songs[currentIndex]) {
      const isCurrent = titleEl.textContent === (songs[currentIndex].title || 'Unknown');
      el.classList.toggle('playing', isCurrent);
    }
  });
}

function updatePlayButton() {
  playBtn.innerHTML = isPlaying ? '⏸' : '▶';
  playBtn.title = isPlaying ? '暂停' : '播放';
  
  if (isPlaying) {
    cover.classList.add('playing');
    cover.classList.remove('paused');
    coverGlow.classList.add('active');
  } else {
    cover.classList.remove('playing');
    cover.classList.add('paused');
    coverGlow.classList.remove('active');
  }
}

function togglePlay() {
  if (songs.length === 0) return;
  
  if (isPlaying) {
    audio.pause();
  } else {
    audio.play().catch(err => {
      console.error('Failed to play:', err);
      showToast('播放失败');
    });
  }
}

function nextSong() {
  if (songs.length === 0) return;
  
  if (playMode === 'shuffle') {
    if (shuffleIndices.length === 0) {
      shuffleIndices = shuffleArray([...Array(songs.length).keys()]);
    }
    const currentShuffleIndex = shuffleIndices.indexOf(currentIndex);
    const nextShuffleIndex = (currentShuffleIndex + 1) % shuffleIndices.length;
    currentIndex = shuffleIndices[nextShuffleIndex];
  } else {
    currentIndex = (currentIndex + 1) % songs.length;
  }
  
  loadSong(currentIndex, true);
}

function prevSong() {
  if (songs.length === 0) return;
  
  if (playMode === 'shuffle') {
    if (shuffleIndices.length === 0) {
      shuffleIndices = shuffleArray([...Array(songs.length).keys()]);
    }
    const currentShuffleIndex = shuffleIndices.indexOf(currentIndex);
    const prevShuffleIndex = (currentShuffleIndex - 1 + shuffleIndices.length) % shuffleIndices.length;
    currentIndex = shuffleIndices[prevShuffleIndex];
  } else {
    currentIndex = (currentIndex - 1 + songs.length) % songs.length;
  }
  
  loadSong(currentIndex, true);
}

function toggleShuffle() {
  if (playMode === 'shuffle') {
    playMode = 'order';
    shuffleBtn.classList.remove('active');
    repeatBtn.classList.add('active');
    showToast('顺序播放');
  } else {
    playMode = 'shuffle';
    shuffleBtn.classList.add('active');
    repeatBtn.classList.remove('active');
    shuffleIndices = shuffleArray([...Array(songs.length).keys()]);
    showToast('随机播放');
  }
}

function toggleRepeat() {
  if (playMode === 'repeat') {
    playMode = 'order';
    repeatBtn.classList.remove('active');
    showToast('顺序播放');
  } else {
    playMode = 'repeat';
    repeatBtn.classList.add('active');
    shuffleBtn.classList.remove('active');
    showToast('单曲循环');
  }
}

function updateVolumeUI() {
  volumeFill.style.width = `${currentVolume * 100}%`;
  
  if (audio.muted || currentVolume === 0) {
    volumeBtn.textContent = '🔇';
  } else if (currentVolume < 0.3) {
    volumeBtn.textContent = '🔈';
  } else if (currentVolume < 0.7) {
    volumeBtn.textContent = '🔉';
  } else {
    volumeBtn.textContent = '🔊';
  }
}

function setVolume(value) {
  currentVolume = Math.max(0, Math.min(1, value));
  audio.volume = currentVolume;
  audio.muted = false;
  updateVolumeUI();
}

function toggleMute() {
  audio.muted = !audio.muted;
  updateVolumeUI();
  showToast(audio.muted ? '已静音' : '取消静音');
}

function updateProgress(e) {
  if (!audio.duration) return;
  
  const rect = progressBar.getBoundingClientRect();
  const percent = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  audio.currentTime = percent * audio.duration;
}

audio.addEventListener('play', () => {
  isPlaying = true;
  updatePlayButton();
});

audio.addEventListener('pause', () => {
  isPlaying = false;
  updatePlayButton();
});

audio.addEventListener('ended', () => {
  if (playMode === 'repeat') {
    audio.currentTime = 0;
    audio.play().catch(() => {});
  } else {
    nextSong();
  }
});

audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  
  const percent = (audio.currentTime / audio.duration) * 100;
  progressFill.style.width = `${percent}%`;
  currentTimeEl.textContent = formatTime(audio.currentTime);
});

audio.addEventListener('loadedmetadata', () => {
  totalTimeEl.textContent = formatTime(audio.duration);
});

audio.addEventListener('error', (e) => {
  console.error('Audio error:', e);
  showToast('音频加载失败');
});

progressBar.addEventListener('click', updateProgress);

let isDragging = false;

progressBar.addEventListener('mousedown', (e) => {
  isDragging = true;
  updateProgress(e);
});

document.addEventListener('mousemove', (e) => {
  if (isDragging) {
    updateProgress(e);
  }
});

document.addEventListener('mouseup', () => {
  isDragging = false;
});

volumeSliderContainer.addEventListener('click', (e) => {
  const rect = volumeSliderContainer.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  setVolume(percent);
});

let isVolumeDragging = false;

volumeSliderContainer.addEventListener('mousedown', (e) => {
  isVolumeDragging = true;
  const rect = volumeSliderContainer.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  setVolume(percent);
});

document.addEventListener('mousemove', (e) => {
  if (isVolumeDragging) {
    const rect = volumeSliderContainer.getBoundingClientRect();
    const percent = (e.clientX - rect.left) / rect.width;
    setVolume(percent);
  }
});

document.addEventListener('mouseup', () => {
  isVolumeDragging = false;
});

playBtn.addEventListener('click', togglePlay);
prevBtn.addEventListener('click', prevSong);
nextBtn.addEventListener('click', nextSong);
shuffleBtn.addEventListener('click', toggleShuffle);
repeatBtn.addEventListener('click', toggleRepeat);
volumeBtn.addEventListener('click', toggleMute);

searchInput.addEventListener('input', (e) => {
  const value = e.target.value.trim();
  clearBtn.classList.toggle('visible', value.length > 0);
  renderList(value);
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  clearBtn.classList.remove('visible');
  renderList();
  searchInput.focus();
});

document.addEventListener('keydown', (e) => {
  if (e.target === searchInput && e.code !== 'Escape') return;
  
  switch (e.code) {
    case 'Space':
      e.preventDefault();
      togglePlay();
      break;
    case 'ArrowLeft':
      e.preventDefault();
      prevSong();
      break;
    case 'ArrowRight':
      e.preventDefault();
      nextSong();
      break;
    case 'ArrowUp':
      e.preventDefault();
      setVolume(currentVolume + 0.1);
      break;
    case 'ArrowDown':
      e.preventDefault();
      setVolume(currentVolume - 0.1);
      break;
    case 'KeyM':
      e.preventDefault();
      toggleMute();
      break;
    case 'Escape':
      if (e.target === searchInput) {
        searchInput.blur();
        searchInput.value = '';
        clearBtn.classList.remove('visible');
        renderList();
      }
      break;
  }
});

cover.src = DEFAULT_COVER;
updateVolumeUI();

window.addEventListener('load', () => {
  fetchSongs();
});
</script>

</body>
</html>
