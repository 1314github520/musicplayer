<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Music Player</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:"Microsoft YaHei",sans-serif;
  background:#000;
  color:#fff;
  overflow-x:hidden;
}

.bg{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background-size:cover;
  background-position:center;
  filter:blur(30px) brightness(0.35);
  transform:scale(1.1);
  z-index:-1;
  transition:0.5s;
}

.player{
  width:100%;
  max-width:420px;
  margin:40px auto;
  padding:20px;
}

.cover{
  width:240px;
  height:240px;
  border-radius:50%;
  display:block;
  margin:auto;
  object-fit:cover;
  box-shadow:0 10px 40px rgba(0,0,0,0.6);
}

.cover.playing{
  animation:rotate 20s linear infinite;
}

@keyframes rotate{
  from{
    transform:rotate(0deg);
  }
  to{
    transform:rotate(360deg);
  }
}

.song-title{
  text-align:center;
  margin-top:25px;
  font-size:24px;
  font-weight:bold;
}

.song-artist{
  text-align:center;
  margin-top:10px;
  color:rgba(255,255,255,0.7);
  font-size:14px;
}

.progress-wrap{
  margin-top:30px;
}

.progress-bar{
  width:100%;
  height:5px;
  background:rgba(255,255,255,0.15);
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
}

.progress-fill{
  width:0%;
  height:100%;
  background:#1db954;
}

.time-info{
  margin-top:10px;
  display:flex;
  justify-content:space-between;
  color:rgba(255,255,255,0.6);
  font-size:12px;
}

.controls{
  margin-top:25px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
}

.ctrl-btn{
  width:50px;
  height:50px;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,0.1);
  color:#fff;
  font-size:18px;
  cursor:pointer;
  transition:0.2s;
}

.ctrl-btn:hover{
  background:rgba(255,255,255,0.2);
}

.ctrl-btn.primary{
  width:65px;
  height:65px;
  background:#1db954;
  font-size:28px;
}

.list{
  margin-top:30px;
  background:rgba(255,255,255,0.05);
  border-radius:12px;
  overflow:hidden;
  max-height:420px;
  overflow-y:auto;
}

.list::-webkit-scrollbar{
  width:4px;
}

.list::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,0.2);
}

.list-item{
  display:flex;
  align-items:center;
  padding:12px;
  border-bottom:1px solid rgba(255,255,255,0.05);
  cursor:pointer;
  transition:0.2s;
}

.list-item:hover{
  background:rgba(255,255,255,0.08);
}

.list-item.playing{
  background:rgba(29,185,84,0.12);
}

.item-cover{
  width:50px;
  height:50px;
  border-radius:8px;
  object-fit:cover;
  margin-right:12px;
}

.item-info{
  flex:1;
  overflow:hidden;
}

.item-title{
  font-size:15px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.item-singer{
  margin-top:5px;
  font-size:12px;
  color:rgba(255,255,255,0.5);
}

.item-duration{
  font-size:12px;
  color:rgba(255,255,255,0.5);
}

.loading{
  text-align:center;
  padding:30px;
  color:rgba(255,255,255,0.6);
}

.error{
  text-align:center;
  padding:30px;
  color:#ff6b6b;
}
</style>
</head>

<body>

<div class="bg" id="bg"></div>

<div class="player">

  <img
    id="cover"
    class="cover"
    src="/resource/img/default.jpg"
  />

  <div class="song-title" id="title">
    Music Player
  </div>

  <div class="song-artist" id="artist">
    Loading...
  </div>

  <audio id="audio"></audio>

  <div class="progress-wrap">

    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="time-info">
      <span id="currentTime">0:00</span>
      <span id="totalTime">0:00</span>
    </div>

  </div>

  <div class="controls">

    <button class="ctrl-btn" id="prevBtn">
      ⏮
    </button>

    <button class="ctrl-btn primary" id="playBtn">
      ▶
    </button>

    <button class="ctrl-btn" id="nextBtn">
      ⏭
    </button>

  </div>

  <div class="list" id="list">

    <div class="loading">
      Loading songs...
    </div>

  </div>

</div>

<script>
const API_BASE = '/api';

let songs = [];
let currentIndex = 0;
let isPlaying = false;

const audio = document.getElementById('audio');

const cover = document.getElementById('cover');

const titleEl = document.getElementById('title');

const artistEl = document.getElementById('artist');

const playBtn = document.getElementById('playBtn');

const prevBtn = document.getElementById('prevBtn');

const nextBtn = document.getElementById('nextBtn');

const progressBar = document.getElementById('progressBar');

const progressFill = document.getElementById('progressFill');

const currentTimeEl = document.getElementById('currentTime');

const totalTimeEl = document.getElementById('totalTime');

const listEl = document.getElementById('list');

const bg = document.getElementById('bg');

/**
 * 时间格式化
 */
function formatTime(sec){

  if(!sec || isNaN(sec)){
    return '0:00';
  }

  const m = Math.floor(sec / 60);

  const s = Math.floor(sec % 60);

  return `${m}:${s.toString().padStart(2,'0')}`;
}

/**
 * 加载歌曲列表
 */
async function fetchSongs(){

  try{

    const res = await fetch(API_BASE + '/songs/all');

    const json = await res.json();

    if(json.code !== 0){
      throw new Error(json.message);
    }

    songs = json.data || [];

    if(!songs.length){

      listEl.innerHTML = `
        <div class="error">
          No songs found
        </div>
      `;

      return;
    }

    renderList();

    loadSong(0);

  }catch(e){

    console.error(e);

    listEl.innerHTML = `
      <div class="error">
        Failed to load songs
      </div>
    `;
  }
}

/**
 * 渲染播放列表
 */
function renderList(){

  listEl.innerHTML = '';

  songs.forEach((song,index)=>{

    const div = document.createElement('div');

    div.className = 'list-item';

    div.innerHTML = `
      <img
        class="item-cover"
        src="${song.photo || '/resource/img/default.jpg'}"
        onerror="this.src='/resource/img/default.jpg'"
      />

      <div class="item-info">

        <div class="item-title">
          ${song.title || 'Unknown'}
        </div>

        <div class="item-singer">
          ${song.singer || song.artist || 'Unknown'}
        </div>

      </div>

      <div class="item-duration">
        ${song.duration_text || ''}
      </div>
    `;

    div.onclick = ()=>{
      loadSong(index,true);
    };

    listEl.appendChild(div);
  });
}

/**
 * 加载歌曲
 */
function loadSong(index,autoPlay=false){

  currentIndex = index;

  const song = songs[index];

  audio.src = API_BASE + '/song/play?id=' + song.id;

  cover.src = song.photo || '/resource/img/default.jpg';

  titleEl.textContent = song.title || 'Unknown';

  artistEl.textContent =
    song.singer ||
    song.artist ||
    'Unknown';

  bg.style.backgroundImage =
    `url(${song.photo || '/resource/img/default.jpg'})`;

  highlightCurrent();

  if(autoPlay){

    audio.play().catch(err=>{
      console.error(err);
    });
  }
}

/**
 * 高亮当前播放
 */
function highlightCurrent(){

  document.querySelectorAll('.list-item')
    .forEach((el,index)=>{

      el.classList.toggle(
        'playing',
        index === currentIndex
      );
    });
}

/**
 * 更新播放按钮
 */
function updatePlayButton(){

  playBtn.innerHTML =
    isPlaying ? '⏸' : '▶';

  if(isPlaying){

    cover.classList.add('playing');

  }else{

    cover.classList.remove('playing');
  }
}

/**
 * 播放/暂停
 */
function togglePlay(){

  if(isPlaying){

    audio.pause();

  }else{

    audio.play().catch(err=>{
      console.error(err);
    });
  }
}

/**
 * 下一首
 */
function nextSong(){

  currentIndex++;

  if(currentIndex >= songs.length){
    currentIndex = 0;
  }

  loadSong(currentIndex,true);
}

/**
 * 上一首
 */
function prevSong(){

  currentIndex--;

  if(currentIndex < 0){
    currentIndex = songs.length - 1;
  }

  loadSong(currentIndex,true);
}

/**
 * 播放状态
 */
audio.addEventListener('play',()=>{

  isPlaying = true;

  updatePlayButton();
});

audio.addEventListener('pause',()=>{

  isPlaying = false;

  updatePlayButton();
});

/**
 * 自动下一首
 */
audio.addEventListener('ended',()=>{

  nextSong();
});

/**
 * 更新进度
 */
audio.addEventListener('timeupdate',()=>{

  if(!audio.duration){
    return;
  }

  const percent =
    (audio.currentTime / audio.duration) * 100;

  progressFill.style.width =
    percent + '%';

  currentTimeEl.textContent =
    formatTime(audio.currentTime);

  totalTimeEl.textContent =
    formatTime(audio.duration);
});

/**
 * 点击跳转进度
 */
progressBar.addEventListener('click',(e)=>{

  const rect =
    progressBar.getBoundingClientRect();

  const percent =
    (e.clientX - rect.left) / rect.width;

  if(audio.duration){

    audio.currentTime =
      percent * audio.duration;
  }
});

/**
 * 按钮事件
 */
playBtn.addEventListener('click',togglePlay);

prevBtn.addEventListener('click',prevSong);

nextBtn.addEventListener('click',nextSong);

/**
 * 初始化
 */
window.onload = fetchSongs;
</script>

</body>
</html>
