<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🎵 音乐播放器</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: "微软雅黑", sans-serif;
  color:#fff;
  background:#000;
}

/* ✅ 高斯模糊背景 */
.bg {
  position: fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  background-size: cover;
  background-position: center;
  filter: blur(30px) brightness(0.4);
  transform: scale(1.1);
  z-index:-1;
  transition: background-image 0.5s;
}

.player {
  max-width:420px;
  margin:40px auto;
  text-align:center;
}

.cover {
  width:220px;
  height:220px;
  border-radius:50%;
  box-shadow:0 10px 40px rgba(0,0,0,0.6);
}

.list {
  margin-top:20px;
  background:rgba(255,255,255,0.05);
  border-radius:10px;
  max-height:300px;
  overflow-y:auto;
}

.list-item {
  padding:12px;
  cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,0.08);
}

.list-item:hover {
  background:rgba(255,255,255,0.1);
}

.playing {
  color:#1db954;
}
</style>
</head>

<body>

<!-- ✅ 背景层 -->
<div class="bg" id="bg"></div>

<div class="player">
  <img id="cover" class="cover" src="img/default.jpg"/>
  <h2 id="title">音乐播放器</h2>
  <p id="artist">请选择歌曲</p>

  <audio id="audio" controls style="width:100%"></audio>

  <div class="list" id="list"></div>
</div>

<script>
const BASE_URL = "https://hello.584399.xyz";

let songs = [];
let index = 0;

const audio = document.getElementById("audio");

// 获取歌曲
async function fetchSongs() {
  const res = await fetch(BASE_URL + "/songs/all");
  const json = await res.json();

  if (json.code === 0) {
    songs = json.data;
    initPlaylist();
    load(0);
  }
}

// 渲染列表
function initPlaylist() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  songs.forEach((s, i) => {
    const div = document.createElement("div");
    div.className = "list-item";

    div.innerHTML = `
      ${i+1}. ${s.title} - ${s.singer || s.artist}
      <span style="float:right">${s.duration_text || ""}</span>
    `;

    div.onclick = () => load(i, true);
    list.appendChild(div);
  });
}

// 加载歌曲
function load(i, autoPlay=false) {
  index = i;
  const song = songs[i];

  audio.src = BASE_URL + "/song/play?id=" + song.id;

  document.getElementById("cover").src = song.photo;
  document.getElementById("title").textContent = song.title;
  document.getElementById("artist").textContent = song.singer || song.artist;

  // ✅ 更新模糊背景
  document.getElementById("bg").style.backgroundImage = `url(${song.photo})`;

  highlight();

  if (autoPlay) audio.play();
}

// 高亮
function highlight() {
  document.querySelectorAll(".list-item").forEach((el,i)=>{
    el.classList.toggle("playing", i===index);
  });
}

// 下一首
audio.addEventListener("ended", ()=>{
  index = (index + 1) % songs.length;
  load(index, true);
});

window.onload = fetchSongs;
</script>

</body>
</html>
